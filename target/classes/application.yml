server:
  port: 8080

spring:
  application:
    name: chatpass-platform
  data:
    redis:
      host: localhost
      port: 6379
      database: 0

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

chatpass:
  mqtt:
    enabled: true
    cluster-id: mqtt-cluster-local
    region: local
    zone: local-a
    public-endpoint: ws://localhost:8083/mqtt
    node-id: chatpass-node-1
    host: 0.0.0.0
    port: 1883
    websocket-enabled: true
    websocket-port: 8083
    websocket-path: /mqtt
    cluster-enabled: true
    cluster-bus-channel-prefix: chatpass:mqtt:cluster
    heartbeat-interval-ms: 10000
    heartbeat-ttl-ms: 30000
    route-shard-count: 1024
    max-connections: 10000
    max-connections-per-tenant: 1000
    max-payload-bytes: 1048576
    publish-rate-limit-per-minute: 6000
    offline-enabled: true
    bridge-ingress: true
  protection:
    rate-limit-enabled: true
    ingress-rate-limit-per-minute: 3000
    webhook-rate-limit-per-minute: 3000
    max-message-bytes: 1048576
  security:
    ingress:
      enabled: true
      api-key: dev-chatpass-key
      webhook-secrets:
        facebook: dev-facebook-secret
        whatsapp: dev-whatsapp-secret
        line: dev-line-secret
        instagram: dev-instagram-secret
  history:
    elasticsearch:
      enabled: false
      endpoint: http://localhost:9200
      index: chatpass-message-history
  dify:
    enabled: false
    base-url: https://api.dify.ai/v1
    api-key:
  routing:
    rules:
      - id: dify-keyword-demo
        name: Dify keyword demo
        enabled: true
        priority: 100
        workflow:
          type: DIFY_CHAT
          target: default-dify-chat
          parameters:
            responseChannel: same-channel
        conditions:
          - field: content.text
            operator: CONTAINS
            value: ai
      - id: fallback-auto-reply
        name: Fallback auto reply
        enabled: true
        priority: 0
        workflow:
          type: AUTO_REPLY
          target: fallback
          parameters:
            text: Message accepted by ChatPass.
        conditions: []
